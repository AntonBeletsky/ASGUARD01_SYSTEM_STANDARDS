<!DOCTYPE html>
<!--
  Diagram Editor — ER diagram editor, Bootstrap 5.3.8, vanilla ES2022, no jQuery.
  Structure (containerization-11 / orchestration-2):
    <style>   1. tokens  2. layout  3. dialog  4. states  5. responsive
    <body>    .diagram-page (orchestrator) > .theme-container + .diagram-container
    <script>  ThemeController, DiagramController, DiagramPageController, INIT
  Configuration, three layers (later wins): static DEFAULTS < new DiagramController(sel, opts)
  < data attributes, e.g. <section class="diagram-container" data-diagram-history-limit="50">.
  Hooks in JS: data-ref (cached once), data-action, data-id, data-state only. No ids/classes as hooks.
  Lifecycle states (root data-state), allowed transitions in DiagramController.TRANSITIONS:
    idle -> dragging | panning | drawing | dialog | pinching;  dragging, panning -> idle | pinching;  drawing -> idle | dialog;  others -> idle.
    Responsive: the widget adapts to its own container (container queries); JS reads the profile token from the canvas.
    Normalize is an instant command (idle -> idle): one history entry, then the view is fitted.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Diagram Editor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<style>
  /* ===== .diagram-page (orchestrator): layout only ===== */
  /* 0. Tokens: --diagram-canvas-min is the only contract with the widget. Unset, the widget keeps the minimum of its own profile; a short window lowers it. */
  /* 1. Container layout: the page shell owns the window height and the device safe areas; widgets only grow into it. */
  .diagram-page { min-height: 100vh; min-height: 100dvh; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  /* 2. Child elements (Bootstrap utilities stay in the markup; only what a utility cannot do lives here). */
  .diagram-page .diagram-header { margin-bottom: 1rem; }
  /* 3. Modal: none */
  /* 4. States: none (the color mode comes from data-bs-theme) */
  /* 5. Animations: none */
  /* 6. Responsive: window height only (widgets adapt to their own container width). A short window, such as a landscape phone, drops the subtitle, tightens the header and lowers the canvas minimum so the page does not scroll. */
  @media (max-height: 30rem) {
    .diagram-page { --diagram-canvas-min: 8rem; }
    .diagram-page .diagram-header { margin-bottom: .5rem; }
    .diagram-page .diagram-subtitle { display: none; }
  }

  /* ===== .theme-container ===== */
  /* 0. Tokens: Bootstrap's secondary color pulled toward the body color, so the outline button reaches 4.5:1 in both color modes. */
  .theme-container { --theme-ink: color-mix(in srgb, var(--bs-secondary) 55%, var(--bs-body-color)); }
  /* 1. Container layout: none (Bootstrap button) */
  /* 2. Child elements */
  .theme-container .btn-outline-secondary { --bs-btn-color: var(--theme-ink); }
  /* 3. Modal: none */
  /* 4. States: none (aria-pressed is styled by Bootstrap) */
  /* 5. Animations: none */
  /* 6. Responsive: none */

  /* ===== .diagram-container ===== */
  /* 0. Tokens: derived from Bootstrap variables, so both color modes work without overrides. The ink tokens pull a Bootstrap color toward the body color
     until text reaches 4.5:1 (and graphics 3:1) on the toolbar, the canvas and the panels in light and dark. */
  .diagram-container {
    --diagram-line: var(--bs-body-color);
    --diagram-edge: var(--bs-link-color);
    --diagram-ink-secondary: color-mix(in srgb, var(--bs-secondary) 55%, var(--bs-body-color));
    --diagram-ink-primary: color-mix(in srgb, var(--bs-primary) 55%, var(--bs-body-color));
    --diagram-ink-danger: color-mix(in srgb, var(--bs-danger) 55%, var(--bs-body-color));
    --diagram-select: var(--diagram-ink-danger);
    --diagram-text-size: 11px;
    --diagram-title-size: 12px;
    --diagram-toolbar-gap: .375rem;
  }
  /* 1. Container layout: the stage is the size container (the card itself must not be one: containment would trap the fixed dialog). */
  .diagram-container .diagram-stage { container-type: inline-size; container-name: diagram; min-height: 0; }
  /* 2. Child elements (Pattern A: role classes live under a prefixed ancestor). */
  .diagram-container .diagram-secondary { display: none; }
  .diagram-container .diagram-toolbar { --bs-card-cap-padding-x: .5rem; gap: var(--diagram-toolbar-gap); }
  .diagram-container .diagram-toolbar .btn { --bs-btn-padding-x: .375rem; }
  .diagram-container .btn-outline-secondary { --bs-btn-color: var(--diagram-ink-secondary); }
  .diagram-container .btn-outline-primary { --bs-btn-color: var(--diagram-ink-primary); }
  .diagram-container .btn-outline-danger { --bs-btn-color: var(--diagram-ink-danger); }
  .diagram-container .diagram-canvas { position: relative; min-height: var(--diagram-canvas-min, 14rem); overflow: hidden; background: var(--bs-tertiary-bg); touch-action: none; user-select: none; --diagram-profile: compact; --diagram-fit-padding: 12; }
  .diagram-container .diagram-canvas > svg { display: block; }
  .diagram-container .diagram-status { max-width: calc(100% - 1rem); }
  .diagram-container .diagram-status:empty { display: none; }
  .diagram-container .diagram-inspector { position: absolute; z-index: 5; display: none; flex-direction: column; left: 0; right: 0; bottom: 0; height: 60%; background: var(--bs-body-bg); border: 0 solid var(--bs-border-color); border-top-width: 1px; }
  .diagram-container .diagram-inspector .header { display: flex; align-items: center; justify-content: space-between; padding: .5rem 1rem; border-bottom: 1px solid var(--bs-border-color); }
  .diagram-container .diagram-inspector .body { flex: 1 1 auto; overflow-y: auto; padding: 1rem; }
  .diagram-container .diagram-entity .body { fill: var(--bs-body-bg); stroke: var(--diagram-edge); }
  .diagram-container .diagram-entity .header { fill: var(--bs-primary-bg-subtle); stroke: var(--diagram-edge); cursor: grab; }
  .diagram-container .diagram-entity text { fill: var(--bs-body-color); font: var(--diagram-text-size) var(--bs-font-sans-serif); pointer-events: none; }
  .diagram-container .diagram-entity .title { fill: var(--bs-primary-text-emphasis); font-weight: 600; font-size: var(--diagram-title-size); }
  .diagram-container .diagram-field .cell { fill: transparent; cursor: pointer; }
  .diagram-container .diagram-field .key { fill: var(--bs-success-text-emphasis); font-weight: 600; }
  .diagram-container .diagram-relation .line, .diagram-container .diagram-relation .cardinality { fill: none; stroke: var(--diagram-line); stroke-width: 2; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .diagram-container .diagram-relation .cardinality { pointer-events: none; }
  .diagram-container .diagram-relation .hit { fill: none; stroke: transparent; stroke-width: 24; vector-effect: non-scaling-stroke; pointer-events: stroke; cursor: pointer; }
  .diagram-container .diagram-relation:hover .line, .diagram-container .diagram-relation:hover .cardinality { stroke: var(--diagram-edge); }
  .diagram-container .diagram-relation text { fill: var(--bs-body-color); font: var(--diagram-text-size) var(--bs-font-sans-serif); paint-order: stroke; stroke: var(--bs-tertiary-bg); stroke-width: 5px; pointer-events: none; }
  /* 3. Modal (custom role="dialog" overlay, visibility comes from this._state.modal). */
  .diagram-container .diagram-modal-overlay { position: fixed; inset: 0; z-index: 1055; display: flex; align-items: center; justify-content: center; padding: 1rem; background: rgb(0 0 0 / .5); }
  .diagram-container .diagram-modal { width: min(32rem, 100%); max-height: 90vh; max-height: 90dvh; overflow-y: auto; }
  /* 4. States (data-state and aria-pressed only). */
  .diagram-container .btn[aria-pressed="true"] { background: var(--bs-secondary-bg); border-color: var(--bs-primary); }
  .diagram-container .diagram-secondary[data-state="open"] { display: flex; flex-wrap: wrap; align-items: center; gap: var(--diagram-toolbar-gap); width: 100%; }
  .diagram-container .diagram-inspector[data-state="open"] { display: flex; }
  .diagram-container[data-state="drawing"] .diagram-canvas { cursor: crosshair; }
  .diagram-container[data-state="panning"] .diagram-canvas, .diagram-container[data-state="dragging"] .diagram-canvas { cursor: grabbing; }
  .diagram-container .diagram-entity[data-state="selected"] .body, .diagram-container .diagram-entity:focus-visible .body { stroke: var(--diagram-select); stroke-width: 2.5; }
  .diagram-container .diagram-entity:focus-visible { outline: none; }
  .diagram-container .diagram-field[data-state="selected"] .cell { fill: var(--bs-success-bg-subtle); }
  .diagram-container .diagram-relation[data-state="selected"] .line, .diagram-container .diagram-relation[data-state="selected"] .cardinality, .diagram-container .diagram-relation:focus-visible .line, .diagram-container .diagram-relation:focus-visible .cardinality { stroke: var(--diagram-select); stroke-width: 3; }
  .diagram-container .diagram-relation:focus-visible { outline: none; }
  /* 5. Animations: none (no @keyframes and no transitions, so prefers-reduced-motion is not applicable) */
  /* 6. Responsive: the widget adapts to its own container width; the canvas exposes the profile to JS through custom properties. */
  @media (pointer: coarse), (any-pointer: coarse) { .diagram-container .btn, .diagram-container .form-control, .diagram-container .form-select { min-height: 44px; } .diagram-container .btn { min-width: 44px; } .diagram-container .btn-close { min-width: 44px; min-height: 44px; } .diagram-container .diagram-relation .hit { stroke-width: 44; } }
  @container diagram (min-width: 600px) {
    .diagram-container .diagram-toolbar { --bs-card-cap-padding-x: 1rem; --diagram-toolbar-gap: .5rem; }
    .diagram-container .diagram-toolbar .btn { --bs-btn-padding-x: .625rem; }
    .diagram-container .diagram-canvas { min-height: var(--diagram-canvas-min, 22rem); --diagram-profile: medium; --diagram-fit-padding: 24; }
    .diagram-container .diagram-secondary, .diagram-container .diagram-secondary[data-state="open"] { display: contents; }
    .diagram-container .diagram-more { display: none; }
    .diagram-container .diagram-inspector { top: 0; left: auto; height: auto; width: min(20rem, 85%); border-top-width: 0; border-left-width: 1px; }
  }
  @container diagram (min-width: 960px) {
    .diagram-container .diagram-canvas { --diagram-profile: expanded; --diagram-fit-padding: 40; }
    .diagram-container .diagram-panel-toggle { display: none; }
    .diagram-container .diagram-inspector, .diagram-container .diagram-inspector[data-state="open"] { position: relative; display: flex; z-index: auto; flex: 0 0 20rem; width: auto; }
    .diagram-container .diagram-inspector .header { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    .diagram-container .diagram-inspector .btn-close { display: none; }
    .diagram-container .diagram-inspector .body { position: absolute; inset: 0; }
  }
</style>
</head>
<body>
<div class="diagram-page bg-body text-body d-flex flex-column" data-bs-theme="light">
  <div class="container-fluid pt-3 pb-0 d-flex flex-column flex-grow-1">
    <header class="diagram-header d-flex justify-content-between align-items-start gap-3">
      <div>
        <h1 class="h3 mb-1">Diagram Editor</h1>
        <div class="diagram-subtitle"><p class="text-body-secondary small mb-0 d-none d-sm-block">Drag entities, draw relations, edit fields. There is no live save: export JSON when you are done.</p></div>
      </div>
      <section class="theme-container" aria-label="Theme">
        <button type="button" class="btn btn-outline-secondary" data-action="toggle-theme" data-ref="theme-button" aria-pressed="false">Dark theme</button>
      </section>
    </header>
    <main class="d-flex flex-column flex-grow-1">
      <section class="diagram-container card shadow-sm rounded-bottom-0 flex-grow-1" aria-label="Diagram editor" data-state="idle">
        <div class="diagram-stage d-flex flex-column flex-grow-1">
          <div class="diagram-toolbar card-header d-flex flex-wrap align-items-center" role="toolbar" aria-label="Diagram tools">
            <button type="button" class="btn btn-outline-secondary" data-action="add-entity">+ Entity</button>
            <button type="button" class="btn btn-outline-secondary" data-action="toggle-draw-relation" data-ref="draw-button" aria-pressed="false">Draw relation</button>
            <button type="button" class="btn btn-outline-danger" data-action="delete-selected" data-ref="delete-button" aria-keyshortcuts="Delete Backspace" disabled>Delete</button>
            <button type="button" class="btn btn-outline-secondary" data-action="normalize-layout" data-ref="normalize-button" aria-label="Normalize layout">Normalize</button>
            <button type="button" class="btn btn-outline-secondary" data-action="undo-change" data-ref="undo-button" aria-keyshortcuts="Control+Z Meta+Z" disabled>Undo</button>
            <button type="button" class="btn btn-outline-primary diagram-panel-toggle" data-action="toggle-panel" data-ref="panel-button" aria-expanded="false">Properties</button>
            <button type="button" class="btn btn-outline-secondary diagram-more" data-action="toggle-menu" data-ref="menu-button" aria-expanded="false">More</button>
            <div class="diagram-secondary" data-ref="secondary">
              <button type="button" class="btn btn-outline-secondary" data-action="modal-open-junction">+ Many-to-many</button>
              <button type="button" class="btn btn-outline-secondary" data-action="redo-change" data-ref="redo-button" aria-keyshortcuts="Control+Y Control+Shift+Z Meta+Y Meta+Shift+Z" disabled>Redo</button>
              <div class="btn-group" role="group" aria-label="Zoom">
                <button type="button" class="btn btn-outline-secondary" data-action="decrease-zoom" aria-label="Zoom out">&minus;</button>
                <button type="button" class="btn btn-outline-secondary" data-action="reset-zoom" data-ref="zoom-button" aria-label="Reset zoom, current level 100%">100%</button>
                <button type="button" class="btn btn-outline-secondary" data-action="increase-zoom" aria-label="Zoom in">+</button>
              </div>
              <button type="button" class="btn btn-outline-secondary" data-action="modal-open-help" aria-label="Keyboard shortcuts" title="Keyboard shortcuts">?</button>
              <div class="btn-group ms-auto" role="group" aria-label="Model">
                <button type="button" class="btn btn-outline-secondary" data-action="modal-open-validate" data-ref="validate-button" aria-label="Validate model, no issues">Validate <span class="badge text-bg-warning" data-ref="validate-badge" hidden></span></button>
                <button type="button" class="btn btn-outline-secondary" data-action="export-model">Export JSON</button>
                <button type="button" class="btn btn-outline-secondary" data-action="import-model">Import JSON</button>
              </div>
            </div>
            <input type="file" accept="application/json,.json" data-action="import-file" data-ref="import-input" hidden aria-label="Import JSON file">
          </div>
          <div class="alert alert-danger alert-dismissible m-2 mb-0" role="alert" data-ref="error" hidden>
            <span data-ref="error-text"></span>
            <button type="button" class="btn-close" aria-label="Dismiss message" data-action="dismiss-error"></button>
          </div>
          <p class="visually-hidden" role="status" data-ref="status"></p>
          <div class="diagram-row position-relative d-flex flex-grow-1">
            <div class="diagram-canvas flex-grow-1" data-ref="canvas">
              <svg class="position-absolute top-0 start-0 w-100 h-100" data-ref="svg" role="group" aria-label="Diagram canvas. Tab to the relations or to an entity, press Enter to select it. Arrow keys move an entity or step between relations, Delete removes the focused one.">
                <rect data-action="pan-canvas" width="100%" height="100%" fill="transparent"/>
                <g data-ref="viewport"><g data-ref="relations"></g><g data-ref="entities"></g></g>
              </svg>
              <span class="badge text-bg-warning position-absolute top-0 end-0 m-2" data-ref="dirty-badge" hidden>Unsaved changes</span>
              <p class="diagram-status badge text-bg-dark text-wrap text-start position-absolute bottom-0 start-0 m-2 pe-none" aria-hidden="true" data-ref="notice"></p>
              <p class="position-absolute top-50 start-50 translate-middle text-body-secondary text-center" data-ref="empty" hidden>The model is empty. Add an entity or import a JSON file.</p>
              <div class="position-absolute bottom-0 end-0 m-2 p-2 rounded border bg-body small pe-none d-none d-md-block" aria-hidden="true">
                <div><svg width="34" height="12" class="me-1"><path d="M0 6h34M22 1v10" fill="none" stroke="currentColor" stroke-width="2"/></svg>one</div>
                <div><svg width="34" height="12" class="me-1"><path d="M0 6h34M20 6l14-5M20 6l14 5" fill="none" stroke="currentColor" stroke-width="2"/></svg>many</div>
              </div>
              <ul class="visually-hidden" aria-label="Model outline" data-ref="outline"></ul>
            </div>
            <aside class="diagram-inspector" aria-label="Properties" data-ref="inspector" data-state="">
              <div class="header"><h2 class="title h6 mb-0">Properties</h2><button type="button" class="btn-close" aria-label="Close properties" data-action="close-panel"></button></div>
              <div class="body" data-ref="inspector-body"></div>
            </aside>
          </div>
        </div>
        <div class="diagram-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="diagram-modal-title" data-ref="modal" hidden>
          <div class="diagram-modal card">
            <div class="card-header"><h2 class="title h6 mb-0" id="diagram-modal-title" data-ref="modal-title"></h2></div>
            <div class="body card-body" data-ref="modal-body"></div>
            <div class="actions card-footer d-flex justify-content-end gap-2">
              <button type="button" class="btn btn-outline-secondary" data-action="modal-cancel" data-ref="modal-cancel">Cancel</button>
              <button type="button" class="btn btn-primary" data-action="modal-confirm" data-ref="modal-confirm">OK</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>
<script>
(() => {
'use strict';

/** @typedef {{id:string,name:string,type:string,key:''|'PK'|'FK'|'UK'}} Field */
/** @typedef {{id:string,name:string,x:number,y:number,fields:Field[]}} Entity */
/** @typedef {{id:string,fromField:string,toField:string,label:string}} Relation fromField is the FK (many side), toField the PK/UK (one side). */
/** @typedef {Object} ThemeConfig  Resolved ThemeController settings: DEFAULTS < constructor options < data attributes.
 *  @property {'auto'|'light'|'dark'} initialMode  Start mode; "auto" follows prefers-color-scheme. */
/** @typedef {Object} ThemeState  The single mutable state of ThemeController.
 *  @property {'light'|'dark'} mode  Current color mode. */
/**
 * @typedef {Object} Config  Resolved DiagramController settings: DEFAULTS < constructor options < data-diagram-* attributes.
 * @property {number} historyLimit  Undo entries kept.
 * @property {number} coalesceMs  Edits with the same tag inside this window share one history entry.
 * @property {number} nudge  Keyboard move step in px.
 * @property {number} nudgeLarge  Keyboard move step with Shift, in px.
 * @property {number} minZoom  Lowest zoom factor.
 * @property {number} maxZoom  Highest zoom factor.
 * @property {number} zoomStep  Zoom change of the + and - buttons.
 * @property {number} minReadableZoom  The fit never goes below this zoom (11 px text x 0.82 = 9 px).
 * @property {number} entityWidth  Entity box width.
 * @property {number} headerHeight  Entity header height.
 * @property {number} rowHeight  Field row height.
 * @property {number} markerLength  Length of the crow's foot and of the bar at a relation end.
 * @property {number} markerSpread  Half-width of the crow's foot.
 * @property {number} statusMs  How long a status message stays visible.
 * @property {number} gridSize  Grid of the layout and of manual positions.
 * @property {number} layoutGapX  Gap between neighbours of a layer.
 * @property {number} layoutMinGapY  Smallest gap between layers.
 * @property {number} layoutMaxGapY  Largest gap between layers.
 * @property {number} layoutMaxRowWidth  Width at which unrelated groups wrap into a new row.
 * @property {number} layoutSweeps  Barycenter ordering passes.
 * @property {'auto'|'vertical'|'horizontal'} layoutDirection  Flow of the layers; "auto" picks it from the canvas shape.
 * @property {number} layoutAutoAspect  Canvas width/height from which "auto" flows left to right.
 * @property {number} fitPadding  Fit margin used when the CSS does not provide one.
 * @property {number} maxName  Longest entity name, field name or label.
 * @property {number} maxEntities  Model size limit.
 * @property {number} maxImportBytes  Largest importable file.
 * @property {string} exportFilename  Name of the downloaded JSON file.
 */
/**
 * @typedef {Object} State  The single mutable state of DiagramController; every part of the UI is a projection of it.
 * @property {Entity[]} entities  The model: entities with their fields.
 * @property {Relation[]} relations  The model: foreign-key relations.
 * @property {{type: 'entity'|'field'|'relation', id: string}|null} selection  Current selection.
 * @property {'idle'|'dragging'|'panning'|'drawing'|'dialog'|'pinching'} mode  Interaction state machine (see TRANSITIONS).
 * @property {number} zoom  Viewport scale.
 * @property {number} panX  Viewport translation along x, in canvas pixels.
 * @property {number} panY  Viewport translation along y, in canvas pixels.
 * @property {{kind: 'entity'|'pan', id?: string, ox: number, oy: number, x: number, y: number, moved: boolean}|null} drag  Drag in progress: origin of the dragged thing and start pointer.
 * @property {{parent: string|null}|null} draw  Relation drawing in progress: the id of the picked parent entity.
 * @property {Object|null} modal  Open dialog: { type: 'confirm'|'report'|'help'|'junction', title, ... }.
 * @property {boolean} dirty  Unsaved changes (cleared by an export).
 * @property {string} error  Error message; empty when there is none.
 * @property {string} status  Status message (live region and toast).
 * @property {string[]} undo  Model snapshots to go back to, oldest first.
 * @property {string[]} redo  Model snapshots to go forward to.
 * @property {number} idSeq  Counter that keeps generated ids unique.
 * @property {{tag: string, at: number}} lastCommit  Last history entry, used to coalesce bursts of edits.
 * @property {boolean} panelOpen  Properties sheet open (compact and medium profiles).
 * @property {boolean} menuOpen  Secondary toolbar group open (compact profile).
 * @property {'compact'|'medium'|'expanded'} profile  Responsive profile, read from the CSS.
 * @property {number} fitPadding  Fit margin, read from the CSS.
 * @property {{w: number, h: number}} size  Canvas size in pixels (the viewBox).
 * @property {Map<number, {x: number, y: number}>} pointers  Active pointers on the canvas (pinch tracking).
 * @property {Object|null} pinch  Pinch in progress: start distance, zoom, midpoint and pan.
 * @property {{factor: number, clientX: number, clientY: number}|null} wheel  Wheel zoom waiting for the next animation frame.
 * @property {number} rev  Model revision, bumped by every change and every restore.
 * @property {number} checkedRev  Revision the cached issues belong to.
 * @property {{level: string, text: string}[]} issues  Cached validation result (the badge on Validate).
 */

/**
 * Theme switch widget. Owns only its button; emits `theme:mode-changed`, never touches the page.
 * Configuration, three layers (later wins): static DEFAULTS < new ThemeController(selector, opts) < data attributes.
 *   data-theme-initial-mode="auto|light|dark"  start mode; "auto" follows prefers-color-scheme (default).
 * Events: `theme:mode-changed` on document, detail { mode: 'light' | 'dark' }.
 */
class ThemeController {
  static DEFAULTS = Object.freeze({ initialMode: 'auto' });
  static MODES = Object.freeze(['auto', 'light', 'dark']);

  /**
   * Builds the widget: resolves the config, picks the start mode, caches the button, binds and renders. Does nothing when the root is missing.
   * @param {string|Element} selector  Root element of the widget, or a selector for it.
   * @param {Partial<ThemeConfig>} [opts]  Options; data attributes win over them.
   */
  constructor(selector, opts = {}) {
    this._root = typeof selector === 'string' ? document.querySelector(selector) : selector;
    if (!this._root) return;
    const $ = (sel) => this._root.querySelector(sel);
    this._cfg = { ...ThemeController.DEFAULTS, ...opts, ...this._readDataAttrs() };
    if (!ThemeController.MODES.includes(this._cfg.initialMode)) this._cfg.initialMode = ThemeController.DEFAULTS.initialMode;
    this._media = window.matchMedia('(prefers-color-scheme: dark)');

    const num = (value, fallback) => (value !== null && value !== '' && Number.isFinite(Number(value)) ? Math.max(-1e5, Math.min(1e5, Number(value))) : fallback);

    if (typeof data.$entitymap !== 'string' || !data.$entitymap.startsWith('1.')) bad('missing or unsupported $entitymap version');
    if (!Array.isArray(data.entities) || !Array.isArray(data.relations)) bad('entities[] and relations[] are required');
    if (data.entities.length > cfg.maxEntities) bad('too many entities');
    const layout = isObj(data.layout) ? data.layout : {}, byEntity = new Map(), seen = new Set();
    const entities = data.entities.map((e, i) => {
      if (!isObj(e) || !safeId(e.id)) bad(`entity #${i + 1} has no valid id`);
      if (seen.has(e.id)) bad(`duplicate entity id "${e.id}"`); seen.add(e.id);
      const fields = new Map();
      for (const field of Array.isArray(e.fields) ? e.fields : []) {
        if (!isObj(field) || !field.name) bad(`entity "${e.id}" has an invalid field`);
        const name = text(field.name, cfg.maxName), constraints = Array.isArray(field.constraints) ? field.constraints : [];
        if (fields.has(name)) bad(`duplicate field "${name}" in "${e.id}"`);
        fields.set(name, { id: DiagramController._fieldId(e.id, name), name, type: DiagramController.TYPES.includes(field.type) ? field.type : 'string', key: constraints.includes('pk') ? 'PK' : constraints.includes('fk') ? 'FK' : constraints.includes('unique') ? 'UK' : '' });
      }
      byEntity.set(e.id, fields);
      const pos = isObj(layout[e.id]) ? layout[e.id] : {};
      return { id: e.id, name: text(e.name || e.id, cfg.maxName), x: num(pos.x, 40 + (i % 4) * 280), y: num(pos.y, 40 + Math.floor(i / 4) * 300), fields: [...fields.values()] };
    });
    const relations = [], used = new Set(); let skipped = 0;
    for (const relation of data.relations) {
      const source = isObj(relation) && byEntity.get(relation.from)?.get(relation.from_field), target = isObj(relation) && byEntity.get(relation.to)?.get(relation.to_field);
      if (!source || !target || !['PK', 'UK'].includes(target.key)) { skipped++; continue; }
      const relationId = safeId(relation.id) && !used.has(relation.id) ? relation.id : `relation-${relations.length + 1}`; used.add(relationId);
      relations.push({ id: relationId, fromField: source.id, toField: target.id, label: text(relation.comment ?? relation.label, cfg.maxName) });
    }
    return { entities, relations, skipped, hasLayout: Object.keys(layout).length > 0 };
  }
  /** Keeps only known option keys and drops prototype-pollution keys before the config merge. */
  static _sanitizeOptions(opts) {
    const source = opts && typeof opts === 'object' ? opts : {};
    return Object.fromEntries(Object.entries(source).filter(([key]) => Object.hasOwn(DiagramController.DEFAULTS, key) && !DiagramController.FORBIDDEN_KEYS.includes(key)));
  }
}

/**
 * Orchestrator: no state, no render. Applies the color mode to its own root and owns the child widgets.
 * Options are forwarded as slices: new DiagramPageController('.diagram-page', { theme: {...}, diagram: {...} }).
 */
class DiagramPageController {
  /**
   * Creates the two widgets (theme, diagram) with their option slices and binds the page-level listener. Does nothing when the root is missing.
   * @param {string|Element} selector  Root element of the page, or a selector for it.
   * @param {{theme?: Partial<ThemeConfig>, diagram?: Partial<Config>}} [opts]
   */
  constructor(selector, opts = {}) {
    this._root = typeof selector === 'string' ? document.querySelector(selector) : selector;
    if (!this._root) return;
    this._widgets = [new ThemeController('.theme-container', opts.theme ?? {}), new DiagramController('.diagram-container', opts.diagram ?? {})];
    this._ac = new AbortController();
    this._bind();
  }

  /** Listens for `theme:mode-changed` on document. */
  _bind() {
    const sig = { signal: this._ac.signal };
    document.addEventListener('theme:mode-changed', (e) => this._handleThemeChanged(e), sig);
  }
  /**
   * Applies the color mode to this container only; `data-bs-theme` is Bootstrap's own color-mode attribute.
   * @param {CustomEvent<{mode: string}>} e
   */
  _handleThemeChanged(e) { this._root.dataset.bsTheme = e.detail.mode; }
  /** Tears down both widgets and the page listener. */
  destroy() { this._widgets.forEach((widget) => widget.destroy()); this._ac.abort(); }
}

document.addEventListener('DOMContentLoaded', () => new DiagramPageController('.diagram-page'));
})();
</script>
</body>
</html>
